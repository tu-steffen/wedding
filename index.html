<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đám cưới - Tú & Steffen 2026</title>
    <style>
        body {
            margin: 0;
            background: #ffffff;
        }

        .invitation {
            width: 100%;
            margin: 0 auto;
        }

        img {
            display: block;
            width: 100%;
            height: auto;
        }

        .calendar-section {
            padding: 24px 16px;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .calendar-button {
            display: block;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
            margin: 10px auto;
            padding: 15px 20px;
            border-radius: 10px;
            border: none;
            font-size: 17px;
            font-weight: bold;
            text-decoration: none;
            text-align: center;
            cursor: pointer;
            background: #9c1826;
            color: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .calendar-button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .calendar-button:active {
            transform: translateY(1px);
        }

        .calendar-button.secondary {
            background: #9c1826bd;
        }

        .android-only,
        .apple-only,
        .desktop-only {
            display: none;
        }

        .countdown-toggle {
            padding: 24px 16px;
            text-align: center;
        }
        
        .countdown-toggle a {
            display: block;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
            margin: 0 auto;
            padding: 15px 20px;
            border-radius: 10px;
            background: #9c1826;
            color: #fff;
            font-family: Arial, sans-serif;
            font-size: 17px;
            font-weight: bold;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: transform 0.15s ease, opacity 0.15s ease;
        }
        
        .countdown-toggle a:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        
        .countdown-toggle a:active {
            transform: translateY(1px);
        }
        
        @media (min-width: 768px) {
            .invitation {
                width: 50%;
                max-width: 900px;
            }

            .calendar-section {
                padding-left: 0;
                padding-right: 0;
            }
        }
    </style>
</head>
<body>
    <div class="invitation">
        <img src="page01.webp" alt="">
        <img src="page02.webp" alt="">
        <img src="page03.webp" alt="">
        <img src="page04.webp" alt="">
        <div class="calendar-section">
            <div class="android-only">
                <a
                    class="calendar-button"
                    href="https://calendar.google.com/calendar/r/eventedit?action=TEMPLATE&amp;dates=20261101T040000Z%2F20261101T070000Z&amp;stz=Asia%2FHo_Chi_Minh&amp;etz=Asia%2FHo_Chi_Minh&amp;text=%C4%90%C3%A1m%20c%C6%B0%E1%BB%9Bi%20-%20T%C3%BA%20%26%20Steffen&amp;details=%C4%90%C3%A1m%20c%C6%B0%E1%BB%9Bi%20c%E1%BB%A7a%20T%C3%BA%20%26%20Steffen.&amp;location=CAPELLA%20GALLERY%20HALL%2C%2024%203%20Th%C3%A1ng%202%2C%20H%C3%B2a%20H%C6%B0ng%2C%20H%E1%BB%93%20Ch%C3%AD%20Minh%20700000%2C%20Vietnam"
                    target="_blank"

            </div>

            <div class="apple-only">
                <a class="calendar-button" href="wedding.ics">
                    📅 Thêm vào lịch - Apple
                </a>

                <a
                    class="calendar-button"
                    href="https://calendar.google.com/calendar/r/eventedit?action=TEMPLATE&amp;dates=20261101T040000Z%2F20261101T070000Z&amp;stz=Asia%2FHo_Chi_Minh&amp;etz=Asia%2FHo_Chi_Minh&amp;text=%C4%90%C3%A1m%20c%C6%B0%E1%BB%9Bi%20-%20T%C3%BA%20%26%20Steffen&amp;details=%C4%90%C3%A1m%20c%C6%B0%E1%BB%9Bi%20c%E1%BB%A7a%20T%C3%BA%20%26%20Steffen.&amp;location=CAPELLA%20GALLERY%20HALL%2C%2024%203%20Th%C3%A1ng%202%2C%20H%C3%B2a%20H%C6%B0ng%2C%20H%E1%BB%93%20Ch%C3%AD%20Minh%20700000%2C%20Vietnam"
                    target="_blank"
                    rel="noopener"
                >📅 Thêm vào lịch - Google</a>
            </div>

            <div class="desktop-only">
                <a class="calendar-button" href="wedding.ics">
                    📅 Thêm vào lịch - Apple
                </a>

                <a
                    class="calendar-button"
                    href="https://calendar.google.com/calendar/r/eventedit?action=TEMPLATE&amp;dates=20261101T040000Z%2F20261101T070000Z&amp;stz=Asia%2FHo_Chi_Minh&amp;etz=Asia%2FHo_Chi_Minh&amp;text=%C4%90%C3%A1m%20c%C6%B0%E1%BB%9Bi%20-%20T%C3%BA%20%26%20Steffen&amp;details=%C4%90%C3%A1m%20c%C6%B0%E1%BB%9Bi%20c%E1%BB%A7a%20T%C3%BA%20%26%20Steffen.&amp;location=CAPELLA%20GALLERY%20HALL%2C%2024%203%20Th%C3%A1ng%202%2C%20H%C3%B2a%20H%C6%B0ng%2C%20H%E1%BB%93%20Ch%C3%AD%20Minh%20700000%2C%20Vietnam"
                    target="_blank"
                    rel="noopener"
                >📅 Thêm vào lịch - Google</a>

                <a class="calendar-button secondary" href="wedding.ics" download>
                    📄 Tải file lịch (.ics)
                </a>
            </div>
        </div>
        <img src="page05.webp" alt="">
    </div>

<div class="countdown-toggle">
    <a href="countdown.html">
        ⏳ Mở đếm ngược
    </a>
</div>
    
    <script>
        const userAgent = navigator.userAgent || navigator.vendor || window.opera;
        const isAndroid = /Android/i.test(userAgent);
        const isApple = /iPhone|iPad|iPod/i.test(userAgent);
        if (isAndroid) {
            document.querySelector('.android-only').style.display = 'block';
        } else if (isApple) {
            document.querySelector('.apple-only').style.display = 'block';
        } else {
            document.querySelector('.desktop-only').style.display = 'block';
        }

        const weddingDate = new Date('2026-11-01T11:00:00+07:00').getTime();
        function updateCountdown() {
            const now = Date.now();
            const distance = weddingDate - now;
            if (distance <= 0) {
                document.getElementById('countdown').innerHTML =
                    '<div class="countdown-title">🎉 Hôm nay là ngày cưới!</div>';
                return;
            }
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((distance / (1000 * 60)) % 60);
            const seconds = Math.floor((distance / 1000) % 60);
            document.getElementById('days').textContent = days;
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
        }
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
