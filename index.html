<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đám cưới - Tú & Steffen 2026</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        body {
            margin: 0;
            background: #ffffff;
        }

        .invitation {
            width: 100%;
            margin: 0 auto;
        }

        img {
            display: block;
            width: 100%;
            height: auto;
        }

        .calendar-section {
            padding: 24px 16px;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .side-decoration {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: min(24vw, 420px);
            max-height: 80vh;
            height: auto;
            object-fit: contain;
            opacity: 0.16;
            pointer-events: none;
            z-index: 0;
        }
        
        .side-decoration-left {
            left: 1vw;
        }
        
        .side-decoration-right {
            right: 1vw;
        }
        
        .invitation,
        .location-section {
            position: relative;
            z-index: 1;
        }

        .calendar-button {
            display: block;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
            margin: 10px auto;
            padding: 15px 20px;
            border-radius: 10px;
            border: none;
            font-size: 17px;
            font-weight: bold;
            text-decoration: none;
            text-align: center;
            cursor: pointer;
            background: #9c1826;
            color: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .calendar-button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .calendar-button:active {
            transform: translateY(1px);
        }

        .calendar-button.secondary {
            background: #9c1826bd;
        }

        .android-only,
        .apple-only,
        .desktop-only {
            display: none;
        }

        .countdown-section {
            padding: 10px 16px 24px;
            text-align: center;
        }
        
        .countdown-section iframe {
            display: block;
            width: 100%;
            height: 220px;
            margin: 0 auto;
            border: 0;
            overflow: hidden;
        }

        .location-section {
            padding: 10px 16px 32px;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .location-title {
            margin: 0 0 8px;
            font-size: 22px;
            font-weight: bold;
        }

        .location-address {
            margin: 0 auto 14px;
            max-width: 600px;
            color: #333333;
            font-size: 15px;
            line-height: 1.5;
        }

        .location-map {
            display: block;
            width: 100%;
            max-width: 900px;
            height: 320px;
            margin: 0 auto;
            border: 0;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
        }

        .location-open-link {
            display: inline-block;
            margin-top: 10px;
            color: #9c1826;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
        }

        .location-open-link:hover {
            text-decoration: underline;
        }
        
        @media (min-width: 1000px) {
            .invitation {
                width: 50%;
                max-width: 900px;
            }
            .calendar-section {
                padding-left: 0;
                padding-right: 0;
            }
            .countdown-section {
                padding-left: 0;
                padding-right: 0;
            }
            .location-section {
                padding-left: 0;
                padding-right: 0;
            }
            .side-decoration {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="invitation">
        <img src="page01.webp" alt="">
        <img src="page02.webp" alt="">
        <img src="page03.webp" alt="">
        <img src="page04.webp" alt="">
        <div class="calendar-section">
            <div class="android-only">
                <a
                    class="calendar-button"
                    href="https://calendar.google.com/calendar/r/eventedit?action=TEMPLATE&amp;dates=20261101T040000Z%2F20261101T070000Z&amp;stz=Asia%2FHo_Chi_Minh&amp;etz=Asia%2FHo_Chi_Minh&amp;text=%C4%90%C3%A1m%20c%C6%B0%E1%BB%9Bi%20-%20T%C3%BA%20%26%20Steffen&amp;details=%C4%90%C3%A1m%20c%C6%B0%E1%BB%9Bi%20c%E1%BB%A7a%20T%C3%BA%20%26%20Steffen.&amp;location=CAPELLA%20GALLERY%20HALL%2C%2024%203%20Th%C3%A1ng%202%2C%20H%C3%B2a%20H%C6%B0ng%2C%20H%E1%BB%93%20Ch%C3%AD%20Minh%20700000%2C%20Vietnam"
                    target="_blank"
                    rel="noopener"
                >📅 Thêm vào lịch - Google</a>

                <a class="calendar-button secondary" href="wedding.ics" download>
                    📄 Tải file lịch (.ics)
                </a>
            </div>

            <div class="apple-only">
                <a class="calendar-button" href="wedding.ics">
                    📅 Thêm vào lịch - Apple
                </a>

                <a
                    class="calendar-button"
                    href="https://calendar.google.com/calendar/r/eventedit?action=TEMPLATE&amp;dates=20261101T040000Z%2F20261101T070000Z&amp;stz=Asia%2FHo_Chi_Minh&amp;etz=Asia%2FHo_Chi_Minh&amp;text=%C4%90%C3%A1m%20c%C6%B0%E1%BB%9Bi%20-%20T%C3%BA%20%26%20Steffen&amp;details=%C4%90%C3%A1m%20c%C6%B0%E1%BB%9Bi%20c%E1%BB%A7a%20T%C3%BA%20%26%20Steffen.&amp;location=CAPELLA%20GALLERY%20HALL%2C%2024%203%20Th%C3%A1ng%202%2C%20H%C3%B2a%20H%C6%B0ng%2C%20H%E1%BB%93%20Ch%C3%AD%20Minh%20700000%2C%20Vietnam"
                    target="_blank"
                    rel="noopener"
                >📅 Thêm vào lịch - Google</a>
            </div>

            <div class="desktop-only">
                <a class="calendar-button" href="wedding.ics">
                    📅 Thêm vào lịch - Apple
                </a>

                <a
                    class="calendar-button"
                    href="https://calendar.google.com/calendar/r/eventedit?action=TEMPLATE&amp;dates=20261101T040000Z%2F20261101T070000Z&amp;stz=Asia%2FHo_Chi_Minh&amp;etz=Asia%2FHo_Chi_Minh&amp;text=%C4%90%C3%A1m%20c%C6%B0%E1%BB%9Bi%20-%20T%C3%BA%20%26%20Steffen&amp;details=%C4%90%C3%A1m%20c%C6%B0%E1%BB%9Bi%20c%E1%BB%A7a%20T%C3%BA%20%26%20Steffen.&amp;location=CAPELLA%20GALLERY%20HALL%2C%2024%203%20Th%C3%A1ng%202%2C%20H%C3%B2a%20H%C6%B0ng%2C%20H%E1%BB%93%20Ch%C3%AD%20Minh%20700000%2C%20Vietnam"
                    target="_blank"
                    rel="noopener"
                >📅 Thêm vào lịch - Google</a>

                <a class="calendar-button secondary" href="wedding.ics" download>
                    📄 Tải file lịch (.ics)
                </a>
            </div>
        </div>
        <div class="countdown-section">
            <iframe
                src="countdown.html"
                title="Đếm ngược đến đám cưới"
                scrolling="no"
            ></iframe>
        </div>
        
        <img src="page05.webp" alt="">
    </div>

    <div class="location-section">
        <h2 class="location-title">📍 Địa điểm</h2>
        <p class="location-address">
            CAPELLA GALLERY HALL<br>
            24 Đường Ba Tháng Hai, phường Hòa Hưng,<br>
            Thành phố Hồ Chí Minh, Việt Nam
        </p>

        <iframe
            class="location-map"
            src="https://www.google.com/maps?q=CAPELLA+GALLERY+HALL,+24+Đường+Ba+Tháng+Hai,+Hồ+Chí+Minh,+Vietnam&output=embed"
            title="Bản đồ CAPELLA GALLERY HALL"
            loading="lazy"
            allowfullscreen
        ></iframe>

        <a
            class="location-open-link"
            href="https://www.google.com/maps/search/?api=1&query=CAPELLA+GALLERY+HALL,+24+Đường+Ba+Tháng+Hai,+Hồ+Chí+Minh,+Vietnam"
            target="_blank"
            rel="noopener"
        >
            🗺️ Mở trong Google Maps
        </a>
    </div>
    
    <script>
        const userAgent = navigator.userAgent || navigator.vendor || window.opera;
        const isAndroid = /Android/i.test(userAgent);
        const isApple = /iPhone|iPad|iPod/i.test(userAgent);
        if (isAndroid) {
            document.querySelector('.android-only').style.display = 'block';
        } else if (isApple) {
            document.querySelector('.apple-only').style.display = 'block';
        } else {
            document.querySelector('.desktop-only').style.display = 'block';
        }
    </script>
</body>

<img class="side-decoration side-decoration-left"
     src="phoenix.png"
     alt="">
<img class="side-decoration side-decoration-right"
     src="dragon.png"
     alt="">

</html>
